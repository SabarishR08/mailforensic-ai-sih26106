# Render deployment config — SIH26106 Email Threat Detection Platform
# Free tier: 512MB RAM, spins down after inactivity
# Uses XGB+LGB ensemble only (no torch/transformers — that's 97.5% accuracy)
services:
  - type: web
    name: sih26106-email-forensics
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m backend.app
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: DEBUG_MODE
        value: "false"
      - key: PORT
        value: "10000"
      # API keys — set these in Render dashboard, not here
      - key: GEMINI_API_KEY
        sync: false
      - key: VIRUSTOTAL_API_KEY
        sync: false
      - key: SAFE_BROWSING_API_KEY
        sync: false
      - key: ABUSEIPDB_API_KEY
        sync: false
    healthCheckPath: /api/health
    autoDeploy: true
