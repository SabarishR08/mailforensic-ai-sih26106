services:
  - type: web
    name: ai-email-forensics
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT backend.app:create_app()
    envVars:
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: DEBUG_MODE
        value: false
      - key: GMAIL_CREDENTIALS_JSON
        sync: false  # Set manually in Render dashboard
      - key: GMAIL_REFRESH_TOKEN
        sync: false  # Set manually in Render dashboard
      - key: GEMINI_API_KEY
        sync: false
      - key: VIRUSTOTAL_API_KEY
        sync: false
      - key: SAFE_BROWSING_API_KEY
        sync: false
      - key: ABUSEIPDB_API_KEY
        sync: false
    healthCheckPath: /
    autoDeploy: true
