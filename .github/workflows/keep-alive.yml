name: Keep Render Alive

# Pings /api/health every 10 minutes to prevent Render free-tier cold starts.
# Render free tier spins down after 15 min idle; this keeps it warm continuously.

on:
  schedule:
    # Every 10 minutes, 24/7
    - cron: '*/10 * * * *'
  workflow_dispatch:
    # Allow manual trigger from GitHub Actions UI (useful for forcing a warm-up
    # right before recording your demo video)

jobs:
  ping:
    name: Ping health endpoint
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Ping /api/health (retry through cold starts)
        run: |
          URL="https://sih26106-email-forensics.onrender.com/api/health"

          # A sleeping Render free instance can take 60s+ to boot, so a single
          # 30s request times out during cold starts. Retry across a few minutes
          # so the first attempt warms the instance and a later one verifies it.
          for attempt in 1 2 3 4 5 6 7 8; do
            CODE=$(curl --silent --output /tmp/health_body.txt \
                  --write-out "%{http_code}" --max-time 45 "$URL") || CODE="000"
            if [ "$CODE" = "200" ]; then
              echo "✅ Service is up (HTTP $CODE, attempt $attempt)"
              exit 0
            fi
            echo "⚠️  Attempt $attempt: HTTP ${CODE}; retrying in 20s..."
            sleep 20
          done

          # Best-effort keep-alive: never fail the workflow over a cold start.
          # If the service is genuinely down, the next run in 10 minutes retries.
          echo "⚠️  Service did not return HTTP 200 after 8 attempts."
          echo "    Treating as non-fatal (cold start / mid-deploy)."
          exit 0
