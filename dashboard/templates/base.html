<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AI Email Forensics{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" rel="stylesheet">
    <style>
        :root { --sidebar-width: 250px; --primary: #1a237e; --accent: #283593; }
        body { background: #f0f2f5; font-family: 'Segoe UI', system-ui, sans-serif; }
        .sidebar {
            position: fixed; top: 0; left: 0; width: var(--sidebar-width); height: 100vh;
            background: linear-gradient(180deg, var(--primary) 0%, var(--accent) 100%);
            color: white; padding: 20px 0; z-index: 100;
        }
        .sidebar .brand { padding: 0 20px 30px; font-size: 1.3rem; font-weight: 700; border-bottom: 1px solid rgba(255,255,255,0.15); }
        .sidebar .nav-link { color: rgba(255,255,255,0.8); padding: 12px 20px; font-size: 0.95rem; transition: all 0.2s; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { color: white; background: rgba(255,255,255,0.1); }
        .sidebar .nav-link i { width: 24px; margin-right: 10px; text-align: center; }
        .main-content { margin-left: var(--sidebar-width); padding: 30px; }
        .card { border: none; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
        .stat-card { padding: 24px; text-align: center; }
        .stat-card .number { font-size: 2rem; font-weight: 700; color: var(--primary); }
        .stat-card .label { color: #666; font-size: 0.85rem; margin-top: 4px; }
        .risk-critical { color: #d32f2f; } .risk-high { color: #f57c00; }
        .risk-medium { color: #fbc02d; } .risk-low { color: #388e3c; } .risk-safe { color: #1976d2; }
        .badge-risk { padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <div class="sidebar">
        <div class="brand">
            <i class="fas fa-shield-halved"></i> AI Email Forensics
        </div>
        <nav class="nav flex-column mt-3">
            <a class="nav-link {% if request.endpoint == 'dashboard.dashboard' %}active{% endif %}" href="/dashboard">
                <i class="fas fa-chart-line"></i> Dashboard
            </a>
            <a class="nav-link {% if 'email' in request.endpoint|default('') %}active{% endif %}" href="/email/scan">
                <i class="fas fa-envelope-open-text"></i> Email Scanner
            </a>
            <a class="nav-link {% if 'forensic' in request.endpoint|default('') %}active{% endif %}" href="/forensic/scan">
                <i class="fas fa-microscope"></i> Forensic Analysis
            </a>
            <a class="nav-link {% if 'threat_map' in request.endpoint|default('') %}active{% endif %}" href="/threat-map">
                <i class="fas fa-globe"></i> Threat Map
            </a>
            <a class="nav-link {% if 'threat_intel' in request.endpoint|default('') %}active{% endif %}" href="/dashboard/threat-intel">
                <i class="fas fa-chart-area"></i> Threat Intel
            </a>
            <a class="nav-link" href="/email/demo" target="_blank">
                <i class="fas fa-play-circle"></i> Live Demo
            </a>
        </nav>
    </div>

    <div class="main-content">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
