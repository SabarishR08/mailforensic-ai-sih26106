{% extends "base.html" %}
{% block title %}Threat Map — AI Email Forensics{% endblock %}
{% block content %}
<style>
  body { overflow: hidden; }
  .map-container { display: flex; height: calc(100vh - 56px); }
  #map { flex: 1; z-index: 1; }
  .map-sidebar {
    width: 340px; background: #1a1d23; color: #e0e0e0;
    overflow-y: auto; padding: 16px; border-left: 1px solid #2a2d35;
    font-size: 13px;
  }
  .map-sidebar h5 { color: #fff; margin-bottom: 12px; font-size: 14px; }
  .stat-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #2a2d35; }
  .stat-label { color: #888; }
  .stat-value { color: #fff; font-weight: 600; }
  .country-bar { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
  .country-bar .bar { flex: 1; height: 8px; background: #2a2d35; border-radius: 4px; overflow: hidden; }
  .country-bar .bar-fill { height: 100%; border-radius: 4px; transition: width 0.5s ease; }
  .country-bar .bar-label { min-width: 30px; text-align: right; font-size: 11px; color: #888; }
  .country-bar .bar-name { min-width: 90px; font-size: 12px; }
  .live-feed { max-height: 250px; overflow-y: auto; }
  .feed-item { padding: 8px; margin: 4px 0; background: #22252b; border-radius: 6px; border-left: 3px solid; }
  .feed-item.critical { border-color: #e74c3c; }
  .feed-item.high { border-color: #e67e22; }
  .feed-item.medium { border-color: #f1c40f; }
  .feed-item.low { border-color: #3498db; }
  .feed-item .feed-from { font-weight: 600; color: #fff; font-size: 12px; }
  .feed-item .feed-subject { color: #aaa; font-size: 11px; margin-top: 2px; }
  .feed-item .feed-meta { color: #666; font-size: 10px; margin-top: 4px; }
  .risk-badge { display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 10px; font-weight: 600; }
  .risk-Critical { background: #e74c3c33; color: #e74c3c; }
  .risk-High { background: #e67e2233; color: #e67e22; }
  .risk-Medium { background: #f1c40f33; color: #f1c40f; }
  .risk-Low { background: #3498db33; color: #3498db; }
  .risk-Safe { background: #2ecc7133; color: #2ecc71; }
  .layer-toggle { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
  .layer-toggle input[type=checkbox] { accent-color: #3498db; }
  .layer-toggle label { cursor: pointer; font-size: 12px; }
  .section-divider { border-top: 1px solid #2a2d35; margin: 12px 0; }
  .leaflet-popup-content-wrapper { background: #1a1d23; color: #e0e0e0; border-radius: 8px; }
  .leaflet-popup-tip { background: #1a1d23; }
  .popup-title { font-weight: 700; font-size: 14px; margin-bottom: 6px; }
  .popup-row { font-size: 12px; margin: 3px 0; color: #aaa; }
  .popup-row strong { color: #fff; }
</style>
{% endblock %}

{% block scripts %}
<div class="map-container">
  <div id="map"></div>
  <div class="map-sidebar">
    <h5><i class="fas fa-globe-americas"></i> THREAT MAP</h5>

    <div class="stat-row">
      <span class="stat-label">Total Scans</span>
      <span class="stat-value" id="stat-total">-</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">Geo-Tagged</span>
      <span class="stat-value" id="stat-geo">-</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">Countries</span>
      <span class="stat-value" id="stat-countries">-</span>
    </div>

    <div class="section-divider"></div>
    <h5><i class="fas fa-layer-group"></i> Layers</h5>
    <div class="layer-toggle">
      <input type="checkbox" id="layer-origin" checked onchange="toggleLayer('origin')">
      <label for="layer-origin">🔴 Threat Origins</label>
    </div>
    <div class="layer-toggle">
      <input type="checkbox" id="layer-route" checked onchange="toggleLayer('route')">
      <label for="layer-route">🔵 Routing Hops</label>
    </div>
    <div class="layer-toggle">
      <input type="checkbox" id="layer-heatmap" onchange="toggleLayer('heatmap')">
      <label for="layer-heatmap">🟠 Heat Density</label>
    </div>

    <div class="section-divider"></div>
    <h5><i class="fas fa-clock"></i> Time Range</h5>
    <div style="display:flex;gap:4px;flex-wrap:wrap;">
      <button class="btn btn-sm btn-outline-light time-btn active" onclick="setTimeRange(1, this)">24h</button>
      <button class="btn btn-sm btn-outline-light time-btn" onclick="setTimeRange(7, this)">7d</button>
      <button class="btn btn-sm btn-outline-light time-btn" onclick="setTimeRange(30, this)">30d</button>
      <button class="btn btn-sm btn-outline-light time-btn" onclick="setTimeRange(365, this)">All</button>
    </div>

    <div class="section-divider"></div>
    <h5><i class="fas fa-filter"></i> Risk Filter</h5>
    <div style="display:flex;gap:4px;flex-wrap:wrap;">
      <button class="btn btn-sm btn-outline-danger risk-btn active" onclick="setRiskFilter('', this)">All</button>
      <button class="btn btn-sm btn-outline-danger risk-btn" onclick="setRiskFilter('Critical', this)">Critical</button>
      <button class="btn btn-sm btn-outline-warning risk-btn" onclick="setRiskFilter('High', this)">High</button>
      <button class="btn btn-sm btn-outline-info risk-btn" onclick="setRiskFilter('Medium', this)">Medium</button>
    </div>

    <div class="section-divider"></div>
    <h5><i class="fas fa-flag"></i> Top Threat Sources</h5>
    <div id="country-list"></div>

    <div class="section-divider"></div>
    <h5><i class="fas fa-exclamation-triangle"></i> Recent Phishing</h5>
    <div class="live-feed" id="live-feed"></div>
  </div>
</div>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  // ── Map Setup ──
  const map = L.map('map', {
    center: [20, 0],
    zoom: 2,
    zoomControl: true,
    attributionControl: false,
  });

  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    maxZoom: 19,
    attribution: '&copy; CartoDB',
  }).addTo(map);

  // ── Layer Groups ──
  const originLayer = L.layerGroup().addTo(map);
  const routeLayer = L.layerGroup().addTo(map);
  const heatLayer = L.layerGroup();
  let heatPoints = [];

  // ── State ──
  let currentTimeRange = 1;
  let currentRiskFilter = '';

  // ── Prediction Colors (primary coloring) ──
  const predColors = {
    phishing: '#e74c3c',
    legitimate: '#2ecc71',
    unknown: '#f39c12',
  };

  // ── Risk Colors (fallback) ──
  const riskColors = {
    Critical: '#e74c3c',
    High: '#e67e22',
    Medium: '#f1c40f',
    Low: '#3498db',
    Safe: '#2ecc71',
    Unknown: '#95a5a6',
  };

  // ── Custom Markers ──
  function createMarker(lat, lon, data) {
    // Color by prediction: phishing=red, legitimate=green, unknown=yellow
    const color = predColors[data.prediction] || riskColors[data.risk_level] || '#95a5a6';
    const size = data.risk_score > 70 ? 14 : data.risk_score > 40 ? 10 : 7;

    const icon = L.divIcon({
      className: '',
      html: `<div style="
        width:${size}px; height:${size}px;
        background:${color}; border: 2px solid ${color}44;
        border-radius: 50%; box-shadow: 0 0 ${size}px ${color}66;
      "></div>`,
      iconSize: [size, size],
      iconAnchor: [size/2, size/2],
    });

    const predLabel = data.prediction || 'unknown';
    const predBadgeColor = predColors[predLabel] || '#95a5a6';

    const popup = `
      <div class="popup-title">${data.from || data.email_id || 'Unknown'}</div>
      <div class="popup-row"><strong>Subject:</strong> ${data.subject || 'N/A'}</div>
      <div class="popup-row"><strong>Prediction:</strong> <span style="color:${predBadgeColor};font-weight:700;text-transform:uppercase">${predLabel}</span></div>
      <div class="popup-row"><strong>Location:</strong> ${data.city || '?'}, ${data.country || '?'}</div>
      <div class="popup-row"><strong>ASN:</strong> ${data.asn || 'N/A'} — ${data.org || ''}</div>
      <div class="popup-row"><strong>Hosting:</strong> ${data.hosting ? 'Yes ⚠️' : 'No'}</div>
      <div class="popup-row"><strong>Risk:</strong> <span class="risk-badge risk-${data.risk_level}">${data.risk_level} (${data.risk_score}/100)</span></div>
      <div class="popup-row"><strong>Auth:</strong> SPF ${data.auth?.spf || '?'} / DKIM ${data.auth?.dkim || '?'} / DMARC ${data.auth?.dmarc || '?'}</div>
      <div class="popup-row"><strong>Trust Score:</strong> ${data.trust_score || 0}/100</div>
      <div class="popup-row"><strong>Time:</strong> ${data.timestamp ? new Date(data.timestamp).toLocaleString() : 'N/A'}</div>
    `;

    return L.marker([lat, lon], { icon }).bindPopup(popup, { maxWidth: 320 });
  }

  // ── Route Polyline ──
  function createRouteLine(hops) {
    if (hops.length < 2) return null;
    const coords = hops.map(h => [h.lat, h.lon]);
    const hasSuspicious = hops.some(h => h.suspicious);

    return L.polyline(coords, {
      color: hasSuspicious ? '#e74c3c' : '#3498db',
      weight: hasSuspicious ? 3 : 2,
      opacity: 0.6,
      dashArray: hasSuspicious ? '8, 4' : null,
    });
  }

  // ── Load Data ──
  async function loadMapData() {
    const [pointsRes, statsRes, recentRes] = await Promise.all([
      fetch(`/api/threat-map/points?days=${currentTimeRange}&risk_level=${currentRiskFilter}`),
      fetch(`/api/threat-map/stats?days=${currentTimeRange}`),
      fetch(`/api/threat-map/recent?limit=10`),
    ]);

    const pointsData = await pointsRes.json();
    const statsData = await statsRes.json();
    const recentData = await recentRes.json();

    // Clear layers
    originLayer.clearLayers();
    routeLayer.clearLayers();
    heatPoints = [];

    // Add points
    for (const p of pointsData.points) {
      if (p.type === 'origin' && p.lat && p.lon) {
        createMarker(p.lat, p.lon, p).addTo(originLayer);
        heatPoints.push([p.lat, p.lon, p.risk_score / 100]);
      } else if (p.type === 'route' && p.hops && p.hops.length > 1) {
        const line = createRouteLine(p.hops);
        if (line) line.addTo(routeLayer);

        // Add hop markers
        for (const hop of p.hops) {
          if (hop.lat && hop.lon) {
            const hopIcon = L.divIcon({
              className: '',
              html: `<div style="width:6px;height:6px;background:#fff3;border:1px solid #fff6;border-radius:50%;"></div>`,
              iconSize: [6, 6],
              iconAnchor: [3, 3],
            });
            L.marker([hop.lat, hop.lon], { icon: hopIcon })
              .bindPopup(`<div class="popup-row"><strong>Hop IP:</strong> ${hop.ip}<br><strong>Country:</strong> ${hop.country}</div>`)
              .addTo(routeLayer);
          }
        }
      }
    }

    // Update stats
    document.getElementById('stat-total').textContent = statsData.total_scans || 0;
    document.getElementById('stat-geo').textContent = statsData.geo_tagged || 0;
    document.getElementById('stat-countries').textContent = statsData.countries || 0;

    // Update country list
    const countryList = document.getElementById('country-list');
    const maxCount = statsData.top_countries?.[0]?.count || 1;
    countryList.innerHTML = (statsData.top_countries || []).slice(0, 10).map(c => `
      <div class="country-bar">
        <span class="bar-name">${c.country}</span>
        <div class="bar"><div class="bar-fill" style="width:${(c.count/maxCount)*100}%;background:${riskColors[c.avg_risk > 50 ? 'High' : 'Medium']}"></div></div>
        <span class="bar-label">${c.count}</span>
      </div>
    `).join('');

    // Update recent feed
    const feed = document.getElementById('live-feed');
    feed.innerHTML = (recentData.recent || []).map(r => `
      <div class="feed-item ${(r.risk_level || '').toLowerCase()}">
        <div class="feed-from">${r.from || 'Unknown'}</div>
        <div class="feed-subject">${r.subject || 'No subject'}</div>
        <div class="feed-meta">
          ${r.country || '?'} · <span class="risk-badge risk-${r.risk_level}">${r.risk_level}</span>
          · ${r.timestamp ? new Date(r.timestamp).toLocaleTimeString() : ''}
        </div>
      </div>
    `).join('');
  }

  // ── Layer Toggles ──
  function toggleLayer(layer) {
    if (layer === 'origin') {
      map.hasLayer(originLayer) ? map.removeLayer(originLayer) : map.addLayer(originLayer);
    } else if (layer === 'route') {
      map.hasLayer(routeLayer) ? map.removeLayer(routeLayer) : map.addLayer(routeLayer);
    } else if (layer === 'heatmap') {
      if (map.hasLayer(heatLayer)) {
        map.removeLayer(heatLayer);
      } else {
        // Simple circle-based heatmap (no extra library needed)
        heatLayer.clearLayers();
        for (const [lat, lon, intensity] of heatPoints) {
          L.circle([lat, lon], {
            radius: 50000 + intensity * 100000,
            color: '#e67e22',
            fillColor: '#e67e22',
            fillOpacity: 0.15 + intensity * 0.2,
            weight: 0,
          }).addTo(heatLayer);
        }
        map.addLayer(heatLayer);
      }
    }
  }

  // ── Time Range ──
  function setTimeRange(days, btn) {
    currentTimeRange = days;
    document.querySelectorAll('.time-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    loadMapData();
  }

  // ── Risk Filter ──
  function setRiskFilter(level, btn) {
    currentRiskFilter = level;
    document.querySelectorAll('.risk-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    loadMapData();
  }

  // ── Auto-refresh every 30s ──
  loadMapData();
  setInterval(loadMapData, 30000);
</script>
{% endblock %}
